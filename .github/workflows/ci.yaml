name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установка зависимостей по lock-файлу
        run: uv sync --frozen --group dev

      - name: Формат
        run: uv run ruff format --check . ../scripts

      - name: Линтер
        run: uv run ruff check . ../scripts

      - name: Типы
        run: uv run mypy app

      - name: Тесты
        run: uv run pytest -W error

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Сборка и запуск пяти сервисов без ключа LLM
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120

      - name: Проверка HTTP, PostgreSQL и очереди worker
        run: python3 scripts/check_stack.py

      - name: Диагностика при ошибке
        if: failure()
        run: docker compose logs --tail=100

      - name: Остановка тестового стека
        if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей по lock-файлу
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      - name: Сборка
        run: npm run build

      - name: Тесты диалога и контекста
        run: npm test
