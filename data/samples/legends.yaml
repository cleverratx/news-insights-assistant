# Демо-легенда (ADR 0003): условные названия поверх обезличенных SYNTHETIC_U.
#
# Признаки, связи и суммы берутся из выгрузки, легенда отвечает только за то, как компания
# называется. Названия вымышленные: перед тем как вписать, проверяем поиском, что такой
# компании нет. Условное название в поиск новостей не идёт.
#
# У контрагента:
#   role      — кем приходится клиенту: покупатель, поставщик или перевозчик. Попадает в базу
#               знаний как предположение с источником legend, клиент его подтверждает или правит.
#   industry  — отрасль словами и okved_code — код ОКВЭД. Нужны, только если контрагента нет
#               в выгрузке юрлиц: по ним ищутся новости его отрасли. Если отрасль есть
#               в выгрузке, правы данные, и эти поля не используются.
#
# competitors — реальные игроки рынка демо-компании из открытых источников (Wikidata), url —
# первоисточник. Кандидатов ищет backend/scripts/find_competitors.py, в файл попадают только
# проверенные руками. Связь с клиентом у них одна — «работают на одном рынке», а их названия
# идут в поиск новостей: это реальные компании.
#
# Заготовку с крупнейшими контрагентами собирает backend/scripts/pick_demo_companies.py
# в legends.generated.yaml. Сервис работает и без этого файла: тогда компании показываются
# по идентификаторам, а лента не меняется.

