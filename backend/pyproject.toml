[project]
name = "alfa-news-insights-backend"
version = "0.1.0"
description = "Новостная аналитика для принятия бизнес-решений: API, сбор новостей и агент"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<0.28",
    "feedparser>=6.0,<7",
    "selectolax>=0.3.21,<0.4",
    "rank-bm25>=0.2.2,<0.3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<0.31",
    "arq>=0.26,<0.27",
    "redis>=5.2,<6",
    "structlog>=24.4,<25",
    "orjson>=3.10,<4",
    "pandas>=2.2,<3",
    "pyarrow>=18.0,<19",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<0.8",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
